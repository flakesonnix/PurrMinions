name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout PurrCore
        uses: actions/checkout@v4
        with:
          repository: flakesonnix/PurrCore
          path: ../PurrCore

      - name: Checkout PurrItems
        uses: actions/checkout@v4
        with:
          repository: flakesonnix/PurrItems
          path: ../PurrItems

      - name: Checkout PurrCollections
        uses: actions/checkout@v4
        with:
          repository: flakesonnix/PurrCollections
          path: ../PurrCollections

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build PurrCore
        run: |
          cd ../PurrCore
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Build PurrItems
        run: |
          cd ../PurrItems
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Build PurrCollections
        run: |
          cd ../PurrCollections
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon
        continue-on-error: true

      - name: Build plugin
        run: ./gradlew shadowJar --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: purrminions-jar
          path: build/libs/*.jar
          if-no-files-found: warn
