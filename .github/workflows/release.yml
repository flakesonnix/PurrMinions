name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout PurrCore
        uses: actions/checkout@v4
        with:
          repository: flakesonnix/PurrCore
          path: ../PurrCore

      - name: Checkout PurrItems
        uses: actions/checkout@v4
        with:
          repository: flakesonnix/PurrItems
          path: ../PurrItems

      - name: Checkout PurrCollections
        uses: actions/checkout@v4
        with:
          repository: flakesonnix/PurrCollections
          path: ../PurrCollections

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build PurrCore
        run: |
          cd ../PurrCore
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Build PurrItems
        run: |
          cd ../PurrItems
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Build PurrCollections
        run: |
          cd ../PurrCollections
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Build (tests + jar)
        run: ./gradlew test shadowJar --no-daemon

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Release ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
          fail_on_unmatched_files: false
